name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not paste access tokens (tms_pat_...) or personal data. Security issues: see SECURITY.md."
  - type: input
    id: version
    attributes:
      label: Package version
      placeholder: "@teamso/teamso-mcp 1.1.3"
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options: [Claude Desktop, Claude Code, Cursor, Windsurf, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Connection
      options: [Hosted (mcp.teamso.com), Local package (npx / stdio), Library]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (tool name and arguments, without secrets)

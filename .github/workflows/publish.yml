name: Publish to npm

on:
  release:
    types: [created]
  # Publish an existing tag by hand (e.g. the first release, before npm trusted publishing is set up):
  # gh workflow run publish.yml -f tag=v1.1.1
  workflow_dispatch:
    inputs:
      tag:
        description: 'Git tag to publish (e.g. v1.1.0)'
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Check the tag matches package.json
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          VERSION="v$(node -p "require('./package.json').version")"
          [ "$TAG" = "$VERSION" ] || { echo "tag $TAG does not match package.json $VERSION"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Trusted publishing (OIDC) once it is configured on npmjs.com for this package; until then the
      # NPM_TOKEN repository secret (an npm automation token of the @teamso org) authenticates.
      - name: Publish with provenance
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
